name = "scopedPillai"
version = "0.1.0"
defaultTargets = ["ScopedPillai"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "905b95818eb32af7874a58b427f50c1711a5e96c"

[[lean_lib]]
name = "ScopedPillai"
srcDir = "Proofs"
